name: Scrap Tiket Pesawat

on:
  # Jadwal dinonaktifkan — scraper dijalankan lokal via Claude scheduled agent
  # Manual trigger tetap tersedia jika dibutuhkan
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Jalankan scraper (retry otomatis 2x jika gagal total)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_wait_seconds: 30
          command: python scrape_tiket.py

      - name: Commit & push file Excel ke repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hasil_scraping/*.xlsx 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Tidak ada file baru untuk di-commit."
          else
            git commit -m "Data: $(date +'%y%m%d')-Scrap Tiket Pesawat.xlsx"
            git push
          fi

      - name: Tampilkan summary di GitHub Actions
        if: always()
        run: |
          echo "## 📊 Scrap Tiket Pesawat — $(date +'%d %b %Y')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls hasil_scraping/*.xlsx 1> /dev/null 2>&1; then
            echo "✅ File Excel berhasil dibuat dan tersimpan di repo." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tidak ada file Excel yang dihasilkan." >> $GITHUB_STEP_SUMMARY
          fi
