name: Scrap Tiket Pesawat

on:
  # Otomatis setiap Senin jam 08:00 WIB (01:00 UTC)
  schedule:
    - cron: "0 1 * * 1"

  # Manual — tombol "Run workflow" di GitHub
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Jalankan scraper (retry otomatis 2x jika gagal total)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_wait_seconds: 30
          command: python scrape_tiket.py

      - name: Upload hasil Excel
        if: always()   # upload meski ada error, supaya data parsial tetap tersimpan
        uses: actions/upload-artifact@v4
        with:
          name: hasil-scraping-${{ github.run_id }}
          path: hasil_scraping/*.xlsx
          retention-days: 90

      - name: Tampilkan summary di GitHub Actions
        if: always()
        run: |
          echo "## 📊 Scrap Tiket Pesawat — $(date +'%d %b %Y')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls hasil_scraping/*.xlsx 1> /dev/null 2>&1; then
            echo "✅ File Excel berhasil dibuat" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📥 Download di tab **Artifacts** di halaman ini." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tidak ada file Excel yang dihasilkan." >> $GITHUB_STEP_SUMMARY
          fi
